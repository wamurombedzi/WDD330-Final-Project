<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wadza Curtain Website - Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
  <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
  <header>
    <div class="nav container">
      <a href="#" class="logo">Wadza Curtains</a>
      <i class="bx bx-shopping-bag" id="cart-icon"></i>
    </div>
    /* Cart */
    <div class="cart">
      <h2 class="cart-title">Your cart</h2>
      <!-- Content -->
       <div class="cart-content">

        <div class="cart-box">
          <img src="img/curtains2.avif" alt="" class="cart-img">
          <div class="detail-box">
            <div class="cart-product-title">kitchen curtain</div>
            <div class="cart-price">$25.00</div>
            <input type="number" value="1" class="cart-quantity">
          </div>
          <!-- Remove Cart -->
           <i class="bx bxs-trash-alt cart-remove"></i>
        </div>
       </div>
       <!--Total -->
       <div class="total">
        <div class="total-title">Total</div>
        <div class="total-price">$0</div>
       </div>
       <!-- Buy Button -->
        <button type="button" class="btn-buy">Buy Now</button>
        <!-- Cart Close -->
         <i class="bx bx-x" id="close-cart"></i>
    </div>
  </header>
  <!-- Shop -->
  <section class="shop container">
    <h2 class="section-title">Shop products</h2>
    <!-- Content -->
    <div class="shop-content" height="100%">
      <!-- Box 1 -->
       <div class="product-box">
        <img src="img/curtain1.avif" alt="" class="product-img">
        <h2 class="product-title">bedroom curtain</h2>
        <span class="price">$85.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <!-- Box 2 -->
       <div class="product-box">
        <img src="img/curtain2.avif" alt="" class="product-img">
        <h2 class="product-title">kitchen curtain</h2>
        <span class="price">$95.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <!-- Box 3 -->
       <div class="product-box">
        <img src="img/curtain3.avif" alt="" class="product-img">
        <h2 class="product-title">guest curtain</h2>
        <span class="price">$25.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <div class="product-box">
        <img src="img/curtain4.jpeg" alt="" class="product-img">
        <h2 class="product-title">garage curtain</h2>
        <span class="price">$45.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <div class="product-box">
        <img src="img/curtain5.jpeg" alt="" class="product-img">
        <h2 class="product-title">sitting curtain</h2>
        <span class="price">$88.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <div class="product-box">
        <img src="img/curtain6.jpg" alt="" class="product-img">
        <h2 class="product-title">office curtain</h2>
        <span class="price">$123.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <div class="product-box">
        <img src="img/curtain7.jpg" alt="" class="product-img">
        <h2 class="product-title">study room curtain</h2>
        <span class="price">$25.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
       <div class="product-box">
        <img src="img/curtain8.avif" alt="" class="product-img">
        <h2 class="product-title">lounge curtain</h2>
        <span class="price">$68.00</span>
        <i class="bx bx-shopping-bag add-cart"></i>
       </div>
      </div>
    </section>
</body>
</html>
